# Replace the empty lists with positions measured in YOUR saved map.
# This is ordinary YAML, not a ROS parameter file. Both nodes read the same file.
# Units: x/y in metres, yaw in radians (0 = facing map +x).
frame_id: map

# Add the three goals selected by the instructor, in visit order:
# waypoints:
#   - {name: goal_1, x: <measured x>, y: <measured y>, yaw: <heading>}
#   - {name: goal_2, x: <measured x>, y: <measured y>, yaw: <heading>}
#   - {name: goal_3, x: <measured x>, y: <measured y>, yaw: <heading>}
waypoints:
  - {name: goal_1, x: 0.0317, y: -0.0150, yaw: 0.0}
  - {name: goal_2, x: 0.7456, y: 0.0017, yaw: 0.0}
  - {name: goal_3, x: 2.0826, y: -0.0336, yaw: 0.0}

# At least one previously checked open location reachable from the test area.
# Prefer multiple locations on different sides of the maze, away from walls.
# recovery_waypoints:
#   - {name: open_area, x: <measured x>, y: <measured y>, yaw: <heading>}
recovery_waypoints:
  - {name: recovery_1, x: 2.1811, y: 1.0010, yaw: 0.0}
  - {name: recovery_2, x: 0.4159, y: 0.9295, yaw: 0.0}
